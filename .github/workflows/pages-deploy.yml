name: "Build and Deploy"
on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"

      - name: Install validation dependencies
        run: |
          pnpm --dir tools install --frozen-lockfile --ignore-scripts
          pnpm --dir tools exec playwright install --with-deps chromium

      - name: Check article metadata and code blocks
        run: bundle exec ruby tools/check_posts.rb

      - name: Build preview for validation (including drafts)
        run: bundle exec jekyll build --strict_front_matter --unpublished --drafts --future -d .jekyll-check

      - name: Check local images and render Mermaid diagrams
        run: |
          bundle exec ruby tools/check_site.rb .jekyll-check
          node tools/check_mermaid.cjs .jekyll-check/mermaid.json

      - name: Build site
        run: |
          bundle exec jekyll build --strict_front_matter -d "_site"
        env:
          JEKYLL_ENV: "production"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
